name: Sitemap Publish

on:
  push:
    branches:
      - main

jobs:
  sitemap-publish:
    name: Build & Ping Sitemaps
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (generates sitemap via Next.js)
        run: npm run build

      - name: Ping Google sitemap
        run: |
          echo "Pinging Google Search Console with sitemap..."
          echo "curl 'https://www.google.com/ping?sitemap=https://focorentabilismo.com/sitemap.xml'"
          # TODO: Uncomment the line below when site is live:
          # curl -s "https://www.google.com/ping?sitemap=https://focorentabilismo.com/sitemap.xml"
          echo "Google sitemap ping: SIMULATED (enable when live)"

      - name: Ping Bing sitemap
        run: |
          echo "Pinging Bing Webmaster Tools with sitemap..."
          echo "curl 'https://www.bing.com/ping?sitemap=https://focorentabilismo.com/sitemap.xml'"
          # TODO: Uncomment the line below when site is live:
          # curl -s "https://www.bing.com/ping?sitemap=https://focorentabilismo.com/sitemap.xml"
          echo "Bing sitemap ping: SIMULATED (enable when live)"

      - name: Ping IndexNow (Bing/Yandex)
        run: |
          echo "IndexNow ping for focorentabilismo.com..."
          # TODO: Set up IndexNow key at https://www.indexnow.org/
          # curl -s "https://api.indexnow.org/indexnow?url=https://focorentabilismo.com/sitemap.xml&key=YOUR_KEY"
          echo "IndexNow ping: SIMULATED (configure key when live)"

      - name: Summary
        run: |
          echo "=== Sitemap Publish Summary ==="
          echo "Build: SUCCESS"
          echo "Sitemap URL: https://focorentabilismo.com/sitemap.xml"
          echo "Google ping: SIMULATED"
          echo "Bing ping: SIMULATED"
          echo "IndexNow ping: SIMULATED"
          echo ""
          echo "Next steps:"
          echo "  1. Verify site is live at focorentabilismo.com"
          echo "  2. Uncomment curl commands in this workflow"
          echo "  3. Set up IndexNow key for faster indexing"
