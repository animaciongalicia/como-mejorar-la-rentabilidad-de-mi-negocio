name: Sitemap Publish

on:
  push:
    branches:
      - main

jobs:
  sitemap-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (generates sitemap via Next.js)
        run: npm run build

      - name: Notify search engines about updated sitemap
        run: |
          SITEMAP_URL="https://focorentabilismo.com/sitemap.xml"

          echo "=== Sitemap Publish Summary ==="
          echo "Sitemap URL: $SITEMAP_URL"
          echo ""

          # Google Sitemap ping
          # TODO: Uncomment in production when domain is live
          # GOOGLE_RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
          #   "https://www.google.com/ping?sitemap=${SITEMAP_URL}")
          # echo "Google ping response: $GOOGLE_RESPONSE"
          echo "Google ping: Would ping https://www.google.com/ping?sitemap=${SITEMAP_URL}"

          # Bing Sitemap ping
          # TODO: Uncomment in production when domain is live
          # BING_RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
          #   "https://www.bing.com/ping?sitemap=${SITEMAP_URL}")
          # echo "Bing ping response: $BING_RESPONSE"
          echo "Bing ping: Would ping https://www.bing.com/ping?sitemap=${SITEMAP_URL}"

          echo ""
          echo "=== Summary ==="
          echo "Branch: $GITHUB_REF_NAME"
          echo "Commit: $GITHUB_SHA"
          echo "Timestamp: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          echo "Status: Build completed. Sitemap ready for indexing."

      - name: Generate sitemap summary
        run: |
          echo "## Sitemap Publication Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Sitemap URL | https://focorentabilismo.com/sitemap.xml |" >> $GITHUB_STEP_SUMMARY
          echo "| RSS Feed | https://focorentabilismo.com/feed.xml |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`$GITHUB_SHA\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Timestamp | $(date -u +"%Y-%m-%dT%H:%M:%SZ") |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Search engines will be notified once the domain is live." >> $GITHUB_STEP_SUMMARY
