name: Content Distribution

on:
  workflow_dispatch:
    inputs:
      post_slug:
        description: 'Slug del post a distribuir (ej: como-calcular-margen-bruto)'
        required: true
        type: string
      platforms:
        description: 'Plataformas de distribución'
        required: true
        type: choice
        default: 'all'
        options:
          - all
          - linkedin
          - newsletter

jobs:
  distribute:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extract post frontmatter and generate distribution copy
        run: |
          POST_SLUG="${{ github.event.inputs.post_slug }}"
          PLATFORMS="${{ github.event.inputs.platforms }}"
          POST_FILE="content/posts/${POST_SLUG}.mdx"

          echo "=== Content Distribution: $POST_SLUG ==="
          echo "Platforms: $PLATFORMS"
          echo ""

          if [ ! -f "$POST_FILE" ]; then
            echo "ERROR: Post file not found: $POST_FILE"
            exit 1
          fi

          # Extract frontmatter fields using node
          node --input-type=module << NODEEOF
          import fs from 'fs'

          const content = fs.readFileSync('${POST_FILE}', 'utf8')
          const fmMatch = content.match(/^---\n([\s\S]*?)\n---\n([\s\S]*)$/)

          if (!fmMatch) {
            console.error('No frontmatter found')
            process.exit(1)
          }

          const fm = fmMatch[1]
          const body = fmMatch[2]

          const extract = (key) => {
            const match = fm.match(new RegExp(\`^\${key}:\\s*["']?([^"'\\n]+)["']?\\s*\$\`, 'm'))
            return match ? match[1].trim() : ''
          }

          const title = extract('title')
          const description = extract('description')
          const pilar = extract('pilar')
          const cluster = extract('cluster')
          const date = extract('date')

          // Extract first paragraph as excerpt
          const paragraphs = body.split('\n\n').filter(p => p.trim() && !p.startsWith('#'))
          const excerpt = paragraphs[0] ? paragraphs[0].replace(/[#*\[\]]/g, '').trim().slice(0, 280) : description

          const postUrl = \`https://focorentabilismo.com/blog/${POST_SLUG}/\`

          console.log('=== POST DATA ===')
          console.log('Title:', title)
          console.log('Description:', description)
          console.log('Pilar:', pilar)
          console.log('Cluster:', cluster)
          console.log('Date:', date)
          console.log('URL:', postUrl)
          console.log('')

          const platforms = '${PLATFORMS}'

          if (platforms === 'all' || platforms === 'linkedin') {
            console.log('=== LINKEDIN COPY ===')
            console.log(\`\${title}\n\n\${excerpt}...\n\n➡ Lee el artículo completo: \${postUrl}\n\n#rentabilidad #pymes #negociosfisicos #focorentabilismo\`)
            console.log('')
          }

          if (platforms === 'all' || platforms === 'newsletter') {
            console.log('=== NEWSLETTER COPY ===')
            console.log(\`Asunto: \${title}\n\nHola [NOMBRE],\n\n\${description}\n\n\${excerpt}...\n\nLee el artículo completo aquí: \${postUrl}\n\nHasta la próxima,\nFoco Rentabilismo\`)
            console.log('')
          }

          // TODO: Make.com webhook integration point
          // When ready, send to Make.com webhook:
          //
          // const webhookUrl = process.env.MAKE_WEBHOOK_URL
          // if (webhookUrl) {
          //   const payload = {
          //     event: 'new_post',
          //     slug: '${POST_SLUG}',
          //     title,
          //     description,
          //     excerpt,
          //     url: postUrl,
          //     pilar,
          //     cluster,
          //     platforms: '${PLATFORMS}',
          //     timestamp: new Date().toISOString()
          //   }
          //   const response = await fetch(webhookUrl, {
          //     method: 'POST',
          //     headers: { 'Content-Type': 'application/json' },
          //     body: JSON.stringify(payload)
          //   })
          //   console.log('Make.com webhook response:', response.status)
          // }

          console.log('=== Distribution copy generated successfully ===')
          console.log('TODO: Connect Make.com webhook (MAKE_WEBHOOK_URL secret) for automated posting')
          NODEEOF

      - name: Generate distribution summary
        run: |
          echo "## Content Distribution Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Post slug | \`${{ github.event.inputs.post_slug }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Platforms | ${{ github.event.inputs.platforms }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Timestamp | $(date -u +"%Y-%m-%dT%H:%M:%SZ") |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> **Next step**: Connect Make.com webhook via \`MAKE_WEBHOOK_URL\` secret for automated distribution." >> $GITHUB_STEP_SUMMARY
