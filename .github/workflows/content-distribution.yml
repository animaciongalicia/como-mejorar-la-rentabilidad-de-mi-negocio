name: Content Distribution

on:
  workflow_dispatch:
    inputs:
      post_slug:
        description: 'Slug del post a distribuir (ej: como-aumentar-margen-bruto)'
        required: true
        type: string
      platforms:
        description: 'Plataformas de distribución'
        required: true
        type: choice
        options:
          - all
          - linkedin
          - newsletter

jobs:
  distribute-content:
    name: Distribute Post Content
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Read post frontmatter and generate distribution copy
        id: generate-copy
        run: |
          POST_SLUG="${{ github.event.inputs.post_slug }}"
          PLATFORMS="${{ github.event.inputs.platforms }}"

          node -e "
          const fs = require('fs');
          const path = require('path');

          const slug = '$POST_SLUG';
          const platforms = '$PLATFORMS';
          const postsDir = path.join(process.cwd(), 'content', 'posts');

          // Find the post file
          const extensions = ['.mdx', '.md'];
          let postFile = null;
          for (const ext of extensions) {
            const p = path.join(postsDir, slug + ext);
            if (fs.existsSync(p)) { postFile = p; break; }
          }

          if (!postFile) {
            console.error('Post not found: ' + slug);
            console.log('Available posts:');
            if (fs.existsSync(postsDir)) {
              fs.readdirSync(postsDir).forEach(f => console.log('  - ' + f.replace(/\.(mdx|md)$/, '')));
            }
            process.exit(1);
          }

          const content = fs.readFileSync(postFile, 'utf-8');
          const fmMatch = content.match(/^---\n([\s\S]*?)\n---/);
          if (!fmMatch) { console.error('No frontmatter found'); process.exit(1); }

          // Parse frontmatter fields
          const fm = fmMatch[1];
          const get = (field) => {
            const m = fm.match(new RegExp('^' + field + ':\\s*[\"\\']?(.+?)[\"\\']?\\s*$', 'm'));
            return m ? m[1] : '';
          };

          const title = get('title');
          const description = get('description');
          const pilar = get('pilar');
          const date = get('date');
          const url = 'https://focorentabilismo.com/blog/' + slug + '/';

          console.log('');
          console.log('=== DISTRIBUTION COPY GENERATED ===');
          console.log('');
          console.log('Post: ' + title);
          console.log('Slug: ' + slug);
          console.log('Pilar: ' + pilar);
          console.log('URL: ' + url);
          console.log('Platforms: ' + platforms);
          console.log('');

          if (platforms === 'all' || platforms === 'linkedin') {
            console.log('--- LINKEDIN COPY ---');
            console.log('');
            console.log(title);
            console.log('');
            console.log(description);
            console.log('');
            console.log('Lo que vas a encontrar en este artículo:');
            console.log('→ Estrategias probadas para dueños de negocios físicos');
            console.log('→ Sin tecnicismos, sin humo');
            console.log('→ Aplicable desde hoy mismo');
            console.log('');
            console.log('Lee el artículo completo: ' + url);
            console.log('');
            console.log('#rentabilidad #negocio #pymes #' + pilar.replace(/-/g, ''));
            console.log('');
          }

          if (platforms === 'all' || platforms === 'newsletter') {
            console.log('--- NEWSLETTER SUBJECT LINE ---');
            console.log('');
            console.log('Esta semana: ' + title);
            console.log('');
            console.log('--- NEWSLETTER PREVIEW TEXT ---');
            console.log('');
            console.log(description);
            console.log('');
            console.log('--- NEWSLETTER BODY INTRO ---');
            console.log('');
            console.log('Hola [NOMBRE],');
            console.log('');
            console.log('Esta semana hemos publicado algo que te va a interesar:');
            console.log('');
            console.log(description);
            console.log('');
            console.log('Lee el artículo completo aquí: ' + url);
            console.log('');
          }

          console.log('=== END OF DISTRIBUTION COPY ===');
          console.log('');

          // TODO: Make.com webhook integration point
          // When ready, send a POST request to your Make.com webhook:
          // const webhookUrl = process.env.MAKE_WEBHOOK_URL;
          // const payload = { slug, title, description, pilar, url, platforms, date };
          // await fetch(webhookUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
          console.log('NOTE: Make.com webhook integration pending.');
          console.log('Set MAKE_WEBHOOK_URL secret and uncomment webhook code above.');
          "

      - name: Summary
        run: |
          echo ""
          echo "=== Content Distribution Summary ==="
          echo "Post slug: ${{ github.event.inputs.post_slug }}"
          echo "Platforms: ${{ github.event.inputs.platforms }}"
          echo "Status: Distribution copy generated (Make.com webhook pending)"
          echo ""
          echo "Next steps:"
          echo "  1. Copy the generated content above to the respective platforms"
          echo "  2. Configure MAKE_WEBHOOK_URL secret for automated distribution"
          echo "  3. Set up Make.com scenario: GitHub Webhook → LinkedIn + Email"
