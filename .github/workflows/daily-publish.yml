name: Publicación diaria

on:
  schedule:
    - cron: '0 7 * * *'   # Cada día a las 7:00 UTC (9:00 España)
  workflow_dispatch:        # También se puede lanzar a mano desde GitHub

jobs:
  rebuild:
    name: Rebuild Vercel para publicar posts programados
    runs-on: ubuntu-latest

    steps:
      - name: Trigger deploy en Vercel
        run: |
          curl -s -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
          echo "Deploy lanzado — focorentabilismo.com se reconstruirá en ~1 min"
