name: Publicación diaria con IA

on:
  schedule:
    - cron: '0 7 * * *'   # Cada día a las 7:00 UTC (9:00 España)
  workflow_dispatch:        # También se puede lanzar a mano desde GitHub

jobs:
  generate-and-publish:
    name: Generar post y publicar
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generar post con Claude
        id: generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-post.mjs

      - name: Commit y push del nuevo post
        run: |
          git config user.name "Claude Bot"
          git config user.email "noreply@anthropic.com"
          git add content/posts/ content/queue.json
          git diff --staged --quiet && echo "Nada nuevo que commitear" && exit 0
          git commit -m "post: ${{ steps.generate.outputs.title }}"
          git push
