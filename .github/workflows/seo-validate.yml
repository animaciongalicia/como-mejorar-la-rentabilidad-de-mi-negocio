name: SEO Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  seo-validate:
    name: Validate SEO & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (catch build errors)
        run: npm run build

      - name: Validate frontmatter in MDX posts
        id: seo-check
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const POSTS_DIR = path.join(process.cwd(), 'content', 'posts');
          const REQUIRED_FIELDS = ['title', 'description', 'date', 'pilar', 'cluster', 'tags'];
          if (!fs.existsSync(POSTS_DIR)) { console.log('No posts dir found'); process.exit(0); }
          const files = fs.readdirSync(POSTS_DIR).filter(f => f.endsWith('.mdx') || f.endsWith('.md'));
          const errors = [];
          const oks = [];
          for (const file of files) {
            const content = fs.readFileSync(path.join(POSTS_DIR, file), 'utf-8');
            const fmMatch = content.match(/^---\n([\s\S]*?)\n---/);
            if (!fmMatch) { errors.push(file + ': No frontmatter'); continue; }
            const missing = REQUIRED_FIELDS.filter(f => !(new RegExp('^' + f + '\s*:', 'm')).test(fmMatch[1]));
            if (missing.length) errors.push(file + ': Missing: ' + missing.join(', '));
            else oks.push(file + ': OK');
          }
          console.log('=== SEO Frontmatter Validation ===');
          oks.forEach(o => console.log('  OK ' + o));
          if (errors.length > 0) {
            errors.forEach(e => console.log('  FAIL ' + e));
            console.log(errors.length + ' post(s) failed.');
            process.exit(1);
          }
          console.log('All ' + files.length + ' post(s) passed.');
          "

      - name: Comment PR with SEO results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ steps.seo-check.outcome }}' === 'success' ? '✅ SEO Validation Passed' : '❌ SEO Validation Failed';
            const body = `## ${status}\n\nAll required frontmatter fields checked: \`title\`, \`description\`, \`date\`, \`pilar\`, \`cluster\`, \`tags\`\n\nSee workflow logs for details.`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
